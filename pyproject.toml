[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "AI-powered image similarity search using CLIP + FAISS"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers",
  "faiss-cpu",
  "Pillow",
  "numpy",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
